{% extends 'base.html' %}

{% block title %}作品投稿{% endblock %}

{% block css %}
<style>
/* フォーム全体のデザイン */
.col {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
    background: #f9f9f9;
    border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
}

/* 各入力フィールドのデザイン */
.form-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 15px;
}

label {
    font-weight: bold;
    margin-bottom: 5px;
}

input[type="text"], 
textarea, 
select, 
input[type="file"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
}

/* 送信ボタン */
button {
    width: 100%;
    padding: 12px;
    font-size: 18px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.3s ease;
}

button:hover {
    background: #0056b3;
}

/* スマホ対応 */
@media (max-width: 768px) {
    .col {
        padding: 15px;
    }

    input[type="text"], 
    textarea, 
    select {
        font-size: 14px;
    }

    button {
        font-size: 16px;
        padding: 10px;
    }
}

</style>
{% endblock %}


{% block header %}
<!-- Page header with logo and tagline-->
<header class="py-5 bg-light border-bottom mb-4">
    <div class="container">
        <div class="text-center my-5">
            <h1 class="fw-bolder">作品投稿ページ</h1>
            <p class="lead mb-0">このページで作品の投稿ができます</p>
        </div>
    </div>
</header>
{% endblock %}

{% block contents %}
<div class="col offset-2">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <table>
            <div class="form-group">
                <label>タイトル</label>
                {{ form.title }}
            </div>
    
            <div class="form-group">
                <label>作品詳細</label>
                {{ form.detail }}
            </div>
    
            <div class="form-group">
                <label>画像</label>
                {{ form.image }}
            </div>
    
            <div class="form-group">
                <label>カテゴリ</label>
                {{ form.category }}
            </div>
        </table>
        <hr>
        <button type="submit">投稿！</button>
    </form>
</div>
{% endblock %}
